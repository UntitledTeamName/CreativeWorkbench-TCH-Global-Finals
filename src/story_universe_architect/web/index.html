<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="CharacterOS: connected characters, consequential relationships and a coherent story bible."><title>CharacterOS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Unbounded:wght@200;300;400;600;700&display=swap" rel="stylesheet"><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Unbounded:wght@200;300;400;600;700&display=swap');
/* CharacterOS — Industrial Brutalist & Paper Duotone (Light)
   Unbleached tactile proof paper, stark carbon letterpress ink, terracotta & archival verdigris accents, 90° sharp edges. */
:root{
  /* Surfaces (Substrate) */
  --bg-0:#f6f3eb;          /* unbleached tactile proof paper */
  --bg-1:#ffffff;          /* stark index card / clean working surface */
  --bg-2:#eee8dc;          /* recessed drafting tray / proof gutter */
  --bg-3:#e2d9c8;          /* active selection tray / hover wash */
  --line:#d5c8b4;          /* ruled draft grid line */
  --line-soft:#e6ddce;     /* delicate draft hairline */
  --line-dark:#181614;     /* heavy carbon structural rule */
  /* Inks (Duotone System) */
  --ink:#181614;           /* deep carbon letterpress black (>18:1 contrast) */
  --muted:#524d46;         /* archival graphite text (>7:1 contrast) */
  --faint:#7a7266;         /* drafting pencil technical metadata */
  /* Duotone Accents */
  --accent:#b45309;        /* burnt terracotta / sienna proof ink (>5:1 contrast) */
  --accent-2:#0f766e;      /* archival verdigris / blueprint slate (>4.8:1 contrast) */
  --accent-wash:rgba(180,83,9,.08);
  --accent-soft:rgba(180,83,9,.28);
  --edge:#8c8070;          /* ruled technical relationship line */
  --danger:#b91c1c;        /* wax alert red */
  --warn:#c2410c;          /* burnt hazard orange */
  --ok:#15803d;            /* botanical verification green */
  /* Brutalist Hard Offset Shadows */
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:2px 2px 0 var(--ink);
  --shadow-hover:5px 5px 0 var(--ink);
  /* Radii — Absolute Zero (Brutalist 90° sharp corners) */
  --r-sm:0px;--r-md:0px;--r-lg:0px;--r-xl:0px;
  /* Type */
  --sans:'Outfit',Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:'Unbounded',"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,"Courier New",monospace;
  --fs-cap:11px;--fs-sm:13px;--fs:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:26px;--fs-2xl:34px;--fs-display:48px;
  /* Fluid workspace */
  --cast-w:268px;--insp-w:350px;
  /* Brutalist Motion */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 78% -10%,rgba(180,83,9,.04),transparent 60%),
    radial-gradient(900px 600px at -5% 110%,rgba(15,118,110,.03),transparent 55%),
    var(--bg-0);
  color:var(--ink);
  font-family:var(--sans);
  font-size:var(--fs);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  opacity:.035;
  background-image:radial-gradient(#181614 1px,transparent 1px);
  background-size:16px 16px;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:var(--accent-2);text-decoration-color:var(--accent-soft)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;font-weight:700;letter-spacing:-.02em}
svg{display:block}
::selection{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible,[data-action]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:0}
input,textarea,select{background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;padding:12px;color:var(--ink);width:100%;box-shadow:2px 2px 0 var(--line)}
textarea{resize:vertical;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.micro{font:var(--fs-cap) var(--mono);color:var(--faint);letter-spacing:.04em}

/* ---------- Topbar ---------- */
.topbar{height:82px;padding:0 32px;display:flex;align-items:center;gap:16px;background:rgba(246,243,235,.95);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;margin-right:auto}
.brand-logo{height:60px;width:auto;display:block;object-fit:contain}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);border-radius:0;padding:9px 15px;min-height:40px;background:var(--bg-1);font-family:var(--serif);font-weight:600;font-size:var(--fs-sm);line-height:1.4;letter-spacing:-.01em;white-space:nowrap;transition:all 150ms var(--ease-out-expo);color:var(--ink);box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--bg-2);border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:var(--shadow)}
.btn:active{transform:translate(1px,1px);box-shadow:none;transition-duration:0ms}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,#ffffff);box-shadow:var(--shadow);transform:translate(-1px,-1px)}
.btn.primary:active{transform:translate(1px,1px);box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:var(--bg-2);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm);transform:none}
.btn.small{padding:6px 12px;min-height:34px;font-size:var(--fs-sm)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 8%,transparent);box-shadow:3px 3px 0 var(--danger)}
.btn .icon-capsule{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:0;background:color-mix(in srgb,var(--ink) 14%,transparent);margin-left:4px;border:1px solid currentColor;transition:transform .18s,background .15s}
.btn:hover .icon-capsule{transform:translate(1px,-1px);background:color-mix(in srgb,var(--ink) 24%,transparent)}

.icon{width:17px;height:17px;display:inline-block;flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:7px;border-radius:0;padding:4px 8px;font:600 var(--fs-cap) var(--mono);text-transform:uppercase;letter-spacing:.08em;background:var(--bg-1);color:var(--ink);border:1.5px solid var(--ink);white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.badge .dot{width:6px;height:6px;border-radius:0;background:var(--ok);box-shadow:none}
.badge.live{color:var(--accent);border-color:var(--accent);box-shadow:2px 2px 0 var(--accent)}
.badge.live .dot{background:var(--accent)}

/* ---------- Workspace shell ---------- */
.workspace{max-width:1320px;margin:0 auto;padding:30px 32px 56px}
.workspace.blank{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:24px}
.story-head{display:flex;flex-direction:column;gap:12px;margin:6px 0 24px}
.story-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.eyebrow{font:600 var(--fs-cap) var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.eyebrow .sep{color:var(--faint);margin:0 6px}
.story-title{font:700 var(--fs-2xl)/1.08 var(--serif);margin:8px 0 0;color:var(--ink)}
.logline{color:var(--muted);width:100%;max-width:none;font-size:var(--fs-md);line-height:1.65}
.story-controls{display:flex;gap:10px;align-items:center;flex-shrink:0}

/* ---------- Stepper ---------- */
.stepper{display:flex;align-items:center;gap:4px;padding:12px 16px;background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;margin-bottom:18px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.step{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.step span{width:22px;height:22px;border-radius:0;display:grid;place-items:center;background:var(--bg-2);border:1.5px solid var(--ink);font:var(--fs-cap) var(--mono);color:var(--ink)}
.step.done{color:var(--ink)}
.step.done span{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.step.current{color:var(--ink)}
.step.current span{background:var(--ink);color:#fff;border-color:var(--ink)}
.step-line{flex:1;height:2px;background:var(--line);min-width:14px}
.step-right{margin-left:auto;display:flex;align-items:center;gap:12px}

/* ---------- Banners ---------- */
.wide-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;background:var(--bg-1);border:1.5px solid var(--ink);box-shadow:var(--shadow-sm);border-radius:0;margin-bottom:16px}
.wide-banner small{display:block;color:var(--muted);margin-top:2px}
.wide-banner.warn{border-color:var(--warn);box-shadow:2px 2px 0 var(--warn)}
.stage-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px;margin-bottom:18px;background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;box-shadow:var(--shadow-sm)}
.stage-banner h2{font:700 var(--fs-lg) var(--serif)}
.stage-banner p{color:var(--muted);margin-top:6px;max-width:62ch}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;padding:6px;background:var(--bg-2);border:1.5px solid var(--ink);border-radius:0;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none;width:0;height:0}
.tab{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:0;color:var(--muted);font-weight:600;font-size:var(--fs-sm);font-family:var(--serif);letter-spacing:-.01em;white-space:nowrap;transition:background 150ms var(--ease-out-expo),color 150ms var(--ease-out-expo),box-shadow 150ms var(--ease-out-expo);border:1px solid transparent}
.tab:hover{color:var(--ink);background:var(--bg-1);border-color:var(--line)}
.tab.active{background:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--accent);border:1px solid var(--ink)}
.tab .count{margin-left:auto;font:var(--fs-cap) var(--mono);background:var(--bg-3);color:var(--muted);border-radius:0;padding:1px 6px;min-width:20px;text-align:center;border:1px solid var(--line)}
.tab.active .count{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- Footbar ---------- */
.footbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:34px;padding-top:18px;border-top:1.5px solid var(--ink);color:var(--muted);font-size:var(--fs-sm);flex-wrap:wrap}
.provenance-link{background:none;border:0;color:var(--accent-2);font-size:var(--fs-sm);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Cards / grids ---------- */
.content-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;padding:20px;box-shadow:var(--shadow-sm);transition:transform 200ms var(--ease-out-expo),border-color 200ms var(--ease-out-expo),box-shadow 200ms var(--ease-out-expo);position:relative}
.card:hover{transform:translate(-2px,-2px);border-color:var(--ink);box-shadow:var(--shadow)}
.card:active{transform:translate(1px,1px);box-shadow:none;transition-duration:0ms}
.card h3{font:700 var(--fs-md) var(--serif);margin-bottom:6px;color:var(--ink)}
.card-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.card-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tag{font:var(--fs-sm) var(--mono);background:var(--bg-2);border:1px solid var(--ink);color:var(--ink);border-radius:0;padding:4px 8px;cursor:pointer;box-shadow:2px 2px 0 var(--line);transition:background .15s,color .15s,box-shadow .15s,transform .15s}
.tag:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.tag:active{transform:translate(1px,1px);box-shadow:none;transition-duration:0ms}
.detail-block{margin-top:12px}
.detail-label{font:600 var(--fs-cap) var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
.detail-block p{color:var(--ink)}
.detail-sub{color:var(--muted);font-size:var(--fs-sm);margin-top:2px}
.quote{border:1.5px solid var(--ink);padding:12px 16px;margin:12px 0;color:var(--ink);font-style:italic;font-family:var(--sans);font-size:var(--fs-md);background:var(--bg-2);border-radius:0;box-shadow:2px 2px 0 var(--line)}
.detail-kicker{font:600 var(--fs-cap) var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.detail-title{font:700 var(--fs-xl) var(--serif);margin-bottom:4px}
.tension-box{background:var(--bg-2);border:1.5px solid var(--ink);border-radius:0;padding:16px;margin:12px 0;box-shadow:2px 2px 0 var(--line)}
.swap{color:var(--accent)}
.perspective{margin-top:12px;padding:12px;background:var(--bg-1);border:1px solid var(--ink);border-radius:0}
.perspective strong{color:var(--accent-2)}
.source-ref{margin-top:14px;font-size:var(--fs-cap);color:var(--faint);line-height:1.5;border-top:1px dashed var(--line);padding-top:10px}
.empty{color:var(--muted);padding:20px;text-align:center;grid-column:1/-1}
.mt{margin-top:8px}

/* ---------- Cast review ---------- */
.cast-review{grid-template-columns:repeat(2,minmax(0,1fr))}
.review-avatar{width:54px;height:54px;font-size:var(--fs-lg);margin-bottom:10px}

/* ---------- Graph layout (hero) ---------- */
.graph-layout{display:grid;grid-template-columns:var(--cast-w,250px) minmax(0,1fr) var(--insp-w,350px);gap:18px;align-items:stretch;transition:grid-template-columns 250ms var(--ease-out-expo)}
.panel{background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;padding:16px;min-height:0;box-shadow:var(--shadow-sm);transition:all 200ms var(--ease-out-expo)}
.cast-panel{display:flex;flex-direction:column;position:relative;overflow:hidden}
.cast-panel.collapsed{padding:12px 6px;align-items:center}
.cast-panel.collapsed .panel-head{justify-content:center;margin-bottom:8px;width:100%}
.cast-panel.collapsed .panel-head>div,.cast-panel.collapsed .count,.cast-panel.collapsed .sidebar-note{display:none}
.cast-panel.collapsed .character-tile{padding:4px;justify-content:center;min-height:44px;width:44px;border-radius:0}
.cast-panel.collapsed .character-tile>span:not(.monogram){display:none}
.cast-panel.collapsed .character-tile .monogram{margin:0;display:grid}
.panel-toggle{width:28px;height:28px;min-width:28px;min-height:28px;display:grid;place-items:center;border-radius:0;border:1.5px solid var(--ink);background:var(--bg-2);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--line);transition:all 150ms var(--ease-out-expo)}
.panel-toggle:hover{background:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--accent)}
.panel-toggle svg{transform:rotate(180deg);transition:transform 240ms var(--ease-out-expo)}
.cast-panel.collapsed .panel-toggle svg{transform:rotate(0deg)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-head-actions{display:flex;align-items:center;gap:6px}
.panel-title{font:700 var(--fs-md) var(--serif);color:var(--ink)}
.panel-caption{font-size:var(--fs-cap);color:var(--muted);margin-top:2px}
.cast-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;max-height:560px;padding:2px 6px 8px 2px}
.character-tile{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;min-height:52px;border-radius:0;border:1px solid var(--line);background:var(--bg-2);box-shadow:2px 2px 0 var(--line);transition:all 150ms var(--ease-out-expo);width:calc(100% - 4px);box-sizing:border-box}
.character-tile:hover{background:var(--bg-1);border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.character-tile:active{transform:translate(1px,1px);box-shadow:none;transition-duration:0ms}
.character-tile.active{border:1.5px solid var(--ink);background:var(--accent-wash);box-shadow:3px 3px 0 var(--ink)}
.character-tile>span:not(.monogram):not(.tile-arrow){min-width:0;flex:1;overflow:hidden}
.tile-name{display:block;font-family:var(--serif);font-weight:700;font-size:var(--fs-sm);letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-role{display:block;font-size:var(--fs-cap);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-arrow{margin-left:auto;color:var(--faint);font-size:var(--fs-md);flex-shrink:0}
.sidebar-note{margin-top:14px;font-size:var(--fs-sm);color:var(--muted);line-height:1.55;border-top:1px dashed var(--line);padding-top:12px}
.graph-panel{display:flex;flex-direction:column;background:
   radial-gradient(700px 460px at 50% 40%,rgba(180,83,9,.03),transparent 62%),var(--bg-0);position:relative;overflow:hidden;border:1.5px solid var(--ink)}
.graph-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.toolbar-right{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;min-width:40px;min-height:40px;display:grid;place-items:center;border-radius:0;border:1.5px solid var(--ink);background:var(--bg-1);color:var(--ink);box-shadow:2px 2px 0 var(--line);transition:all .15s}
.iconbtn:hover{background:var(--bg-2);color:var(--accent);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
.iconbtn:active{transform:translate(1px,1px);box-shadow:none}
#graph-canvas{width:100%;height:560px;flex:1;touch-action:none;cursor:grab}
#graph-canvas:active{cursor:grabbing}
.graph-foot{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:var(--fs-cap);color:var(--muted);border-top:1.5px solid var(--ink);padding-top:10px}
.legend-line{display:inline-block;width:22px;height:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.keyboard-hint{margin-left:auto;color:var(--faint);font:var(--fs-cap) var(--mono)}

/* Minimap Radar Astrolabe HUD */
.minimap-hud{position:absolute;bottom:42px;right:14px;width:156px;height:116px;background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink);overflow:hidden;z-index:10;display:flex;flex-direction:column;transition:transform 200ms var(--ease-out-expo),opacity 200ms var(--ease-out-expo);user-select:none}
.minimap-hud.minimized{height:28px;width:110px}
.minimap-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:var(--bg-2);border-bottom:1.5px solid var(--ink);font:600 var(--fs-cap) var(--mono);color:var(--ink);cursor:pointer}
.minimap-head:hover{color:var(--accent)}
.minimap-body{flex:1;position:relative;background:var(--bg-0);cursor:crosshair;overflow:hidden}
.minimap-svg{width:100%;height:100%;display:block}
.minimap-lens{fill:var(--accent-wash);stroke:var(--accent);stroke-width:1.5;cursor:grab}
.minimap-lens:active{cursor:grabbing}
.minimap-dot{transition:opacity .15s}

.inspector{display:flex;flex-direction:column;overflow:auto;max-height:640px}
.inspector-body{padding-top:6px}
.inspector-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--ink)}

/* ---------- Monogram ---------- */
.monogram{width:40px;height:40px;border-radius:0;display:grid;place-items:center;font:700 15px var(--serif);color:var(--color);background:var(--wash);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--line);flex-shrink:0}

/* ---------- Section heads / seeds ---------- */
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font:700 var(--fs-xl) var(--serif);color:var(--ink)}
.section-head p{color:var(--muted);margin-top:6px;max-width:60ch}
.seed-number{font:700 var(--fs-md) var(--mono);color:var(--accent);margin-bottom:6px}
.seed-question{margin-top:12px;padding:12px 14px;background:var(--accent-wash);border-radius:0;color:var(--ink);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--line)}
.card.seed-card.catalyst{grid-column:span 2;background:var(--bg-1);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.card.seed-card.catalyst .seed-number{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;background:var(--accent-wash);border:1px solid var(--accent);border-radius:0;font-size:var(--fs-sm)}
.drop-cap{float:left;font:700 44px/0.8 var(--serif);color:var(--accent);margin:2px 8px 0 0;padding-right:2px}

/* ---------- Palette / prompts ---------- */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.palette-chip{font:var(--fs-sm) var(--mono);background:var(--bg-2);border:1px solid var(--ink);border-radius:0;padding:3px 9px;color:var(--ink);box-shadow:2px 2px 0 var(--line)}
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter{font:var(--fs-sm) var(--mono);background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;padding:6px 13px;color:var(--ink);box-shadow:2px 2px 0 var(--line);transition:all .15s}
.filter:hover{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
.filter.active{background:var(--accent);color:#fff;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.searchbox{width:220px;margin-left:auto}
.prompt-card{overflow:hidden;padding:0;background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;box-shadow:var(--shadow-sm);container-type:inline-size}
@container (min-width: 380px) {
  .prompt-cover{height:140px}
  .prompt-body h3{font-size:var(--fs-lg)}
}
.prompt-cover{height:120px;display:flex;align-items:flex-start;justify-content:space-between;padding:14px;position:relative}
.prompt-cover .symbol{font:var(--fs-xl) var(--serif);color:rgba(255,255,255,.95)}
.prompt-cover .badge{background:var(--ink);border-color:#fff;color:#fff}
.prompt-cover.portraits{background:linear-gradient(135deg,#543b2b,#382519)}
.prompt-cover.scenes{background:linear-gradient(135deg,#244340,#172a28)}
.prompt-cover.presentation{background:linear-gradient(135deg,#383531,#211f1d)}
.prompt-cover.moodboard{background:linear-gradient(135deg,#5e4630,#3b2a1a)}
.prompt-body{padding:18px 20px 20px}
.prompt-excerpt{color:var(--muted);font-size:var(--fs-sm);line-height:1.6;margin-top:8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Proposals ---------- */
.proposals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.proposal-status{font:600 var(--fs-sm) var(--mono);color:var(--muted);margin-bottom:8px}
.card .proposal-status{color:var(--accent-2)}
.activity{margin-top:18px;padding:14px 16px;background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;color:var(--muted);font-size:var(--fs-sm);box-shadow:var(--shadow-sm)}

/* ---------- Story Analyst / Insights ---------- */
.analyst-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:24px}
.analyst-card{background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;padding:20px;box-shadow:var(--shadow-sm);position:relative}
.analyst-badge{display:inline-block;padding:3px 8px;font:700 var(--fs-cap) var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;border:1px solid var(--ink)}
.badge-linchpin{background:var(--accent-wash);color:var(--accent);border-color:var(--accent)}
.badge-powderkeg{background:rgba(194,65,12,.12);color:var(--warn);border-color:var(--warn)}
.badge-outsider{background:rgba(15,118,110,.1);color:var(--accent-2);border-color:var(--accent-2)}
.analyst-stat{font:700 var(--fs-2xl) var(--serif);color:var(--ink);margin:4px 0 10px;line-height:1}
.analyst-stat small{font:var(--fs-sm) var(--sans);color:var(--muted);font-weight:400;margin-left:6px}
.analyst-footer-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:var(--bg-2);border:1.5px solid var(--ink);padding:16px 20px;box-shadow:var(--shadow-sm);margin-top:18px}
.metric-box{display:flex;flex-direction:column;gap:4px}
.metric-box .val{font:700 var(--fs-lg) var(--serif);color:var(--ink)}
.metric-box .lbl{font:var(--fs-cap) var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}


/* ---------- Narrative Chronology Timeline ---------- */
.chronology-timeline{display:flex;flex-direction:column;gap:24px;position:relative;margin-top:8px}
.act-group{background:var(--bg-1);border:1.5px solid var(--ink);box-shadow:var(--shadow-sm);padding:20px}
.act-header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.act-header h3{font:700 var(--fs-lg) var(--serif);color:var(--ink)}
.act-header .subtitle{font:var(--fs-sm) var(--sans);color:var(--muted);font-style:italic}
.event-chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.event-item{background:var(--bg-0);border:1.5px solid var(--ink);padding:14px;box-shadow:2px 2px 0 var(--line);display:flex;flex-direction:column;gap:6px;transition:all 150ms var(--ease-out-expo)}
.event-item:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);background:var(--bg-1)}
.event-tag{display:inline-block;align-self:flex-start;padding:2px 7px;font:700 var(--fs-cap) var(--mono);text-transform:uppercase;background:var(--bg-2);border:1px solid var(--ink);color:var(--ink)}
.event-title{font:700 var(--fs-md) var(--serif);margin-top:4px}
.event-summary{font-size:var(--fs-sm);color:var(--muted);line-height:1.55}
.event-involved{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(24,22,20,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;z-index:80;animation:fadeIn .18s ease}
.modal{width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--bg-0);border:2px solid var(--ink);border-radius:0;box-shadow:8px 8px 0 var(--ink);transform-origin:var(--orig-x,50%) var(--orig-y,50%);animation:modalMorphIn 250ms var(--ease-out-expo) both}
.modal.closing{animation:modalMorphOut 150ms var(--ease-out-expo) forwards}
.modal.wide{width:min(940px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px;border-bottom:1.5px solid var(--ink)}
.modal-head h2{font:700 var(--fs-lg) var(--serif)}
.modal-head p{color:var(--muted);margin-top:4px;font-size:var(--fs-sm)}
.modal-body{padding:24px;overflow:auto}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1.5px solid var(--ink);flex-wrap:wrap}
.modal-sub{font:700 var(--fs-md) var(--serif);margin:18px 0 10px}
.form-field{display:block;margin-bottom:14px}
.form-field span{display:block;font-size:var(--fs-sm);color:var(--muted);margin-bottom:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.examples-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.example-btn{text-align:left;padding:14px;border-radius:0;border:1.5px solid var(--ink);background:var(--bg-1);box-shadow:2px 2px 0 var(--ink);transition:all .15s}
.example-btn:hover{background:var(--bg-2);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.example-btn:active{transform:translate(1px,1px);box-shadow:none;transition-duration:0ms}
.example-btn b{display:block;font:700 var(--fs-sm) var(--serif);color:var(--ink)}
.example-btn small{display:block;color:var(--muted);margin-top:4px;font-size:var(--fs-cap)}
.callout{background:var(--accent-wash);border:1.5px solid var(--ink);border-radius:0;padding:14px 16px;color:var(--ink);font-size:var(--fs-sm);line-height:1.6;box-shadow:2px 2px 0 var(--line)}
.callout strong{color:var(--accent)}
.bullets{margin:12px 0 4px;padding-left:20px;color:var(--muted);line-height:1.7}
.bullets li{margin-bottom:8px}
.bullets code{background:var(--bg-2);padding:1px 6px;border-radius:0;color:var(--accent-2);border:1px solid var(--line)}
.error{background:color-mix(in srgb,var(--danger) 8%,transparent);border:1.5px solid var(--danger);color:var(--danger);border-radius:0;padding:10px 12px;font-size:var(--fs-sm);margin-top:10px}
.code{background:var(--bg-1);border:1.5px solid var(--ink);border-radius:0;padding:16px;font:var(--fs-sm)/1.6 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.export-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.export-option{display:flex;align-items:flex-start;gap:14px;text-align:left;padding:16px;border-radius:0;border:1.5px solid var(--ink);background:var(--bg-1);box-shadow:2px 2px 0 var(--ink);transition:all .15s}
.export-option:hover{background:var(--bg-2);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.export-option:active{transform:translate(1px,1px);box-shadow:none;transition-duration:0ms}
.export-option .export-icon{color:var(--accent);width:26px;height:26px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.export-option .export-icon .icon{width:24px;height:24px}
.export-option .export-meta{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.export-option strong{display:block;font-family:var(--serif);font-size:var(--fs-sm);font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
.export-option small{display:block;color:var(--muted);font-family:var(--sans);font-size:var(--fs-cap);line-height:1.45;margin-top:2px}

/* ---------- Blank / placeholder states ---------- */
.blank .topbar{position:relative}
.empty-stage{text-align:center;max-width:560px;padding:20px}
.empty-orbit{position:relative;width:120px;height:120px;margin:0 auto 26px}
.empty-orbit span{position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:0;background:var(--accent);box-shadow:2px 2px 0 var(--ink);animation:orbit 4.2s linear infinite}
.empty-orbit span:nth-child(1){animation-delay:0s}
.empty-orbit span:nth-child(2){animation-delay:-1.4s;background:var(--accent-2);box-shadow:2px 2px 0 var(--ink)}
.empty-orbit span:nth-child(3){animation-delay:-2.8s;background:#9a3412;box-shadow:2px 2px 0 var(--ink)}
.empty-title{font:700 var(--fs-2xl) var(--serif);margin-bottom:12px;color:var(--ink)}
.empty-sub{color:var(--muted);font-size:var(--fs-md);line-height:1.65}
.empty-sub code{background:var(--bg-2);padding:1px 7px;border-radius:0;color:var(--accent-2);border:1px solid var(--line)}
.empty-actions{display:flex;gap:12px;justify-content:center;margin:22px 0 18px;flex-wrap:wrap}
.dropzone{margin-top:8px;border:2px dashed var(--ink);border-radius:0;padding:22px;color:var(--muted);font-size:var(--fs-sm);cursor:pointer;background:var(--bg-1);transition:all 150ms var(--ease-out-expo)}
.dropzone:hover{border-color:var(--accent);background:var(--accent-wash);color:var(--accent);box-shadow:3px 3px 0 var(--ink);transform:scale(1.01)}
.dropzone code{background:var(--bg-2);padding:1px 7px;border-radius:0;color:var(--accent-2);border:1px solid var(--line)}
body.dragging .dropzone{border-color:var(--accent);background:var(--accent-wash);color:var(--accent);transform:scale(1.01)}
body.dragging::after{content:"Drop your universe .json to showcase it";position:fixed;inset:0;background:rgba(246,243,235,.92);backdrop-filter:blur(4px);display:grid;place-items:center;color:var(--accent);font:var(--fs-lg) var(--serif);font-weight:700;z-index:200;pointer-events:none;border:3px dashed var(--ink);border-radius:0;margin:18px}

/* Skeletons */
.skeleton-stage{max-width:760px;margin:0 auto;width:100%}
.sk{background:linear-gradient(90deg,var(--bg-2) 25%,var(--bg-3) 37%,var(--bg-2) 63%);background-size:400% 100%;border-radius:0;border:1px solid var(--line);animation:shimmer 1.4s ease infinite}
.sk-title{height:30px;width:52%;margin-bottom:14px}
.sk-line{height:14px;width:80%;margin-bottom:10px}
.sk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.sk-card{height:120px}
.sk-graph{height:300px;margin-top:22px}
.skeleton-note{text-align:center;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.spinner{width:16px;height:16px;border-radius:0;border:2px solid var(--ink);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}

/* ---------- Relationship graph (SVG) ---------- */
.edge{cursor:pointer}
.edge-path{stroke:var(--edge);stroke-width:1.8;fill:none;stroke-linecap:square;transition:stroke .18s,stroke-width .18s,opacity .18s}
.edge-hit{stroke:transparent;stroke-width:16;fill:none}
.edge-label-bg{fill:var(--bg-1);stroke:var(--ink);stroke-width:1.5;transition:stroke .18s,fill .18s,opacity .18s}
.edge-label{font:var(--fs-cap) var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--bg-1);stroke-width:3px;stroke-linejoin:miter;transition:fill .18s,opacity .18s}
.edge:hover .edge-path{stroke:var(--accent);stroke-width:2.4}
.edge:hover .edge-label-bg{stroke:var(--accent)}
.edge:hover .edge-label{fill:var(--accent)}
.edge.highlighted{opacity:1}
.edge.highlighted .edge-path{stroke:var(--accent);stroke-width:2.6}
.edge.highlighted .edge-label-bg{stroke:var(--accent);fill:#fff}
.edge.highlighted .edge-label{fill:var(--accent);font-weight:700}
.edge.selected{opacity:1}
.edge.selected .edge-path{stroke:var(--accent);stroke-width:2.8}
.edge.selected .edge-label-bg{stroke:var(--accent);fill:#fff}
.edge.selected .edge-label{fill:var(--accent);font-weight:700}
.edge.high-tension .edge-path{stroke:var(--edge);stroke-width:2;stroke-dasharray:5 3}
.edge.high-tension:hover .edge-path{stroke:var(--warn);stroke-width:2.6;stroke-dasharray:none}
.edge.high-tension.highlighted .edge-path,
.edge.high-tension.selected .edge-path{stroke:var(--warn);stroke-width:3.2;stroke-dasharray:none;filter:none}
.edge.dim{opacity:.18;transition:opacity .18s}
#graph-canvas{user-select:none;-webkit-user-select:none}
#graph-canvas text{user-select:none;-webkit-user-select:none;pointer-events:none}
#graph-canvas.dragging, #graph-canvas.dragging *{cursor:grabbing!important;user-select:none}
#graph-canvas.dragging .graph-node{animation:none!important;transition:none!important}
#graph-canvas.dragging .edge-path{animation:none!important;transition:none!important}
#graph-canvas.dragging .edge-hit{animation:none!important}
.graph-node{cursor:grab;user-select:none;-webkit-user-select:none;animation:nodeFadeIn 220ms ease-out both;animation-delay:calc(var(--stagger-i, 0) * 25ms);transition:opacity .18s}
@keyframes nodeFadeIn{from{opacity:0}to{opacity:1}}
.graph-node:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.graph-node:focus-visible .body{stroke:var(--accent);stroke-width:2}
.graph-node .body{fill:var(--bg-1);stroke:var(--ink);stroke-width:1.5;transition:stroke .18s,fill .18s,filter .18s;filter:drop-shadow(2px 2px 0 var(--ink))}
.graph-node:hover .body,
.graph-node.active-hover .body{stroke:var(--accent);fill:#fff;filter:drop-shadow(3px 3px 0 var(--accent))}
.graph-node.connected-peer{opacity:1}
.graph-node.connected-peer .body{stroke:var(--ink);stroke-width:2.2;filter:drop-shadow(3px 3px 0 var(--accent-2))}
.graph-node.selected{opacity:1}
.graph-node.selected .body{stroke:var(--accent);stroke-width:2.5;fill:#fff;filter:drop-shadow(3px 3px 0 var(--accent))}
.graph-node.is-dragging{cursor:grabbing!important}
.graph-node.is-dragging .body{stroke:var(--accent)!important;stroke-width:2.5px!important;fill:#fff!important;filter:drop-shadow(4px 4px 0 var(--ink))!important}
.graph-node.dim{opacity:.22;transition:opacity .18s}
.n-name{font:700 13px/1.2 var(--serif);fill:var(--ink);letter-spacing:-.02em}
.n-role{font:var(--fs-cap) var(--sans);fill:var(--muted)}
.n-initial{font:var(--fs-lg) var(--serif);fill:var(--accent)}

/* ---------- View Transitions ---------- */
::view-transition-old(root),
::view-transition-new(root){
  animation-duration:200ms;
  animation-timing-function:var(--ease-out-expo);
}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:24px;right:24px;z-index:90;display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:0;border:2px solid #ffffff;box-shadow:4px 4px 0 var(--ink);font:600 var(--fs-sm) var(--sans);pointer-events:none;opacity:0;transform:translateY(12px) scale(.96);transition:all 200ms var(--ease-out-expo)}
#toast.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.toast-undo{background:color-mix(in srgb,#fff 18%,transparent);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:0;padding:4px 10px;font:600 var(--fs-cap) var(--mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:background .15s,transform .1s}
.toast-undo:hover{background:rgba(255,255,255,.32);transform:scale(1.05)}
.toast-undo:active{transform:scale(.96)}

/* ---------- Keyframes ---------- */
@keyframes pulseTension{0%{stroke-width:2.2}100%{stroke-width:3.2}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drawEdge{to{stroke-dashoffset:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes orbit{from{transform:rotate(0) translateX(48px) rotate(0)}to{transform:rotate(360deg) translateX(48px) rotate(-360deg)}}
@keyframes modalMorphIn{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}
@keyframes modalMorphOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.92) translateY(8px)}}
@keyframes snapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stagger-item{animation:snapIn 220ms var(--ease-out-expo) both;animation-delay:calc(var(--stagger-i, 0) * 25ms);content-visibility:auto;contain-intrinsic-size:0 140px}

/* ---------- Responsive ---------- */
@media(min-width:1600px){.graph-layout{grid-template-columns:260px minmax(540px,1fr) 370px}.graph-panel{min-height:640px}#graph-canvas{height:580px}.inspector{max-height:690px}.content-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1190px){.graph-layout{grid-template-columns:210px minmax(330px,1fr)}.inspector{grid-column:1/-1;max-height:none}.inspector-body{column-count:2;column-gap:32px}.inspector-body>*{break-inside:avoid}.content-grid{grid-template-columns:repeat(2,1fr)}.cast-review,.proposals{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 20px}.workspace{padding:22px 20px}.story-controls{flex-wrap:wrap;justify-content:flex-end}.brand small{letter-spacing:.5px}}
@media(max-width:760px){.topbar{height:auto;min-height:74px;padding:14px;gap:8px;flex-wrap:wrap}.brand{flex:1 0 70%}.topbar .badge{margin-left:auto}.brand strong{font-size:14px}.workspace{padding:20px 12px}.story-head{display:block}.story-title{font-size:var(--fs-xl)}.story-controls{justify-content:flex-start;padding-top:13px}.stepper{gap:6px;font-size:var(--fs-cap)}.step-line{width:8px}.step-right{width:100%;margin-top:8px}.tabs{gap:14px;overflow:auto}.graph-layout{grid-template-columns:1fr}.cast-panel{display:none}.graph-panel{min-height:420px}#graph-canvas{height:400px;min-height:320px}.inspector-body{column-count:1}.graph-foot{flex-wrap:wrap}.content-grid,.cast-review,.proposals{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.modal-overlay{padding:10px}.modal{max-height:95vh}.modal-head,.modal-body,.modal-footer{padding:18px}.form-row,.export-grid{grid-template-columns:1fr}.footbar{align-items:start;gap:12px}.searchbox{width:100%;margin-left:0}.stage-banner{display:block;padding:18px}.stage-banner .btn{margin-top:13px}}

/* ---------- Reduced motion ---------- */
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.graph-canvas:not(.arranging) .edge-path{stroke-dashoffset:0!important}}

/* ---------- Print ---------- */
@media print{.topbar,.tabs,.stepper,.story-controls,.footbar,.graph-toolbar,.inspector-actions,#modal-root{display:none!important}body{background:var(--bg-1);color:var(--ink)}.workspace{padding:0}.graph-layout{display:block}.cast-panel{display:none}.graph-panel{break-inside:avoid}#graph-canvas{height:470px}.inspector{max-height:none}.inspector-body{overflow:visible}.content-grid{display:block}.card{break-inside:avoid;margin:15px 0;border-color:var(--line)}}

on": "Each story hook references an approved edge and its breaking point."}, {"id": "relationship-pressure", "title": "Connection contains possible change", "principle": "An alliance can hold an incompatible need; tension is not limited to hostility.", "source": "content/npc_templates.yaml: paired metrics and changing states", "extension": "Every edge records what each person wants, what keeps them together and what could break the pattern."}], "examples": {"cyberpunk": {"schema_version": "1.0", "id": "borrowed-light", "revision": 1, "title": "Borrowed Light", "concept": "In a rain-soaked city where memories can be sold, a courier assembles an uneasy alliance to steal back an archive that may explain her sister’s disappearance. Every ally remembers a different version of the same night.", "format": "Novel outline", "genre": "Cyberpunk mystery", "tone": "Luminous, intimate, morally uncertain", "setting": "A vertical coastal city whose public memory archive is scheduled for deletion at dawn.", "thematic_thesis": "Remembering someone does not necessarily give us ownership of their story.", "visual": {"palette": ["electric cyan", "muted magenta", "matte graphite"], "lighting": "Rain-diffused neon with isolated warm practical light", "texture": "Wet glass, scratched polymer, analogue tape and condensation", "composition": "Reflections, obstructed sightlines and generous pockets of darkness", "style": "Restrained near-future noir; human-scale rather than spectacle"}, "characters": [{"id": "mira", "name": "Mira Voss", "role": "Courier · protagonist", "archetype_id": "nadia", "archetype_label": "The Guarded Professional", "communication_style": "Clipped operational facts; personal questions receive route information.", "emotional_baseline": "Contained vigilance", "core_fear": "Becoming property in a city that owns memories.", "core_desire": "Recover the one memory she sold of her sister.", "tendencies": ["Checks exits before speaking.", "Pays debts literally.", "Does not correct people who call her fearless."], "voice_samples": ["Tell me where. You haven't earned why.", "A route isn't an alibi.", "I sold the memory, not the promise."], "backstory": "Mira sold a childhood memory to pay for emergency treatment. A stolen archive suggests the buyer also altered her account of who needed saving.", "appearance": "A woman in her thirties, cropped dark hair, weathered graphite courier jacket with a repaired amber seam; no exaggerated implants."}, {"id": "iko", "name": "Iko Sen", "role": "Archive engineer · uneasy ally", "archetype_id": "ms_vidal", "archetype_label": "The Reassurance Seeker", "communication_style": "Careful qualifications and repeated checks of what was actually agreed.", "emotional_baseline": "Anxious curiosity", "core_fear": "Mistaking a beautiful forgery for a fact.", "core_desire": "Preserve an unedited account of the city.", "tendencies": ["Repeats a claim in narrower words.", "Marks uncertainty before drawing conclusions.", "Keeps analogue copies of fragile evidence."], "voice_samples": ["It proves the file changed. Not who changed it.", "Tell me the part you haven't checked.", "Uncertainty isn't the same as nothing."], "backstory": "Iko maintains a municipal memory archive and once authorized a deletion he was told protected a witness. He now suspects it erased one.", "appearance": "An East Asian man in his late twenties, translucent utility visor raised off tired eyes, ink-stained fingertips, layered grey workwear."}, {"id": "sable", "name": "Sable Quill", "role": "Broker · friend with a price", "archetype_id": "felix", "archetype_label": "The Deflecting Charmer", "communication_style": "Elegant jokes that make the terms sound smaller than they are.", "emotional_baseline": "Performative ease", "core_fear": "Having no value when nobody needs a favor.", "core_desire": "Become necessary to people who cannot buy her.", "tendencies": ["Offers a gift before naming its conditions.", "Avoids direct descriptions of loneliness.", "Never forgets a favor she claims was free."], "voice_samples": ["You can trust me. Just don't confuse that with a discount.", "I didn't sell your name. I leased the opportunity.", "Stay for a drink. That part isn't a transaction."], "backstory": "Sable helped Mira survive her first illegal route. She now holds the access token needed for the archive theft and wants a place in the resulting story.", "appearance": "A Black woman in her forties, tailored plum coat with rain-dark cuffs, a single brass ear cuff, patient smile; human warmth against synthetic surroundings."}, {"id": "oren", "name": "Oren Vale", "role": "Security auditor · pursuer", "archetype_id": "priya", "archetype_label": "The Unsoftened Truth", "communication_style": "Direct distinctions between an authorized action and a defensible one.", "emotional_baseline": "Disciplined unease", "core_fear": "Learning his integrity has only protected the system.", "core_desire": "Make one record stand without compromise.", "tendencies": ["Uses exact names where colleagues use euphemisms.", "Refuses convenient certainty.", "Keeps obsolete orders as evidence."], "voice_samples": ["Legal is the field on the form. I asked whether it happened.", "Your story makes sense. That doesn't make it true.", "I can stop following orders before I stop caring."], "backstory": "Oren signed the order that removed Mira’s sister from the public record. He believes he was protecting her identity; the archive may prove otherwise.", "appearance": "A man in his fifties, close silver hair, unadorned dark raincoat, battered inspection terminal, a composed face caught in reflected cyan."}], "relationships": [{"id": "archive", "source": "mira", "target": "iko", "label": "needs proof", "source_wants": "A route to her sister’s missing memory.", "target_wants": "Protection for the archive, including facts she may dislike.", "shared_history": "Mira saved Iko during a power raid before knowing what he maintained.", "source_read": "He owes her access without conditions.", "target_read": "She proved she might protect evidence rather than exploit it.", "tension": "Her need for a comforting answer can destroy the evidence he needs to preserve.", "breaking_point": "The recovered file contradicts Mira’s last intact memory.", "story_potential": "Mira must choose between recovering a person she recognizes and admitting she never knew the whole story.", "intensity": 5}, {"id": "favor", "source": "sable", "target": "mira", "label": "holds a favor", "source_wants": "A place in Mira’s life that is not purchased.", "target_wants": "Access without another permanent obligation.", "shared_history": "Sable hid Mira after her first failed delivery.", "source_read": "They chose each other before money intervened.", "target_read": "Accepting shelter created a debt she has never been allowed to finish paying.", "tension": "Affection keeps being expressed through leverage.", "breaking_point": "Sable can clear Mira’s debt only by selling the route to someone else.", "story_potential": "She can surrender her hold on Mira or prove that her generosity was another form of ownership.", "intensity": 4}, {"id": "pursuit", "source": "oren", "target": "mira", "label": "pursues", "source_wants": "A witness who will survive long enough to testify.", "target_wants": "An explanation not written by the person who erased her sister.", "shared_history": "Oren’s signature appears on the order Mira has carried for years.", "source_read": "The redaction kept someone alive.", "target_read": "He chose a record over a person.", "tension": "The same omission can look like protection or betrayal.", "breaking_point": "Oren must release an unredacted name to stop the archive wipe.", "story_potential": "Trust requires accepting a cost neither side can undo after publication.", "intensity": 5}, {"id": "transaction", "source": "iko", "target": "sable", "label": "buys time", "source_wants": "Access with a verifiable chain of custody.", "target_wants": "A cop const btn=(label,action,cls='',attrs='')=>`<button class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
function brand(){return `<div class="brand"><img class="brand-logo" src="${LOGO_SRC}" alt="CharacterOS" height="62"></div>`;}

// Blank-first: only restore saved work if this browser has been seen before.
let seen=false;try{seen=!!(localStorage.getItem('characteros-seen')||localStorage.getItem('sua-seen'));}catch{}
const readSaved=()=>{if(!seen||B.portable)return null;try{const s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem('sua-workspace-1.0'));return(s&&C.validate(s.u,B.schema,B.archetypes).ok)?s:null;}catch{return null;}};
const saved=readSaved();
const initial=B.initial||null;
const haveInitial=initial&&C.validate(initial,B.schema,B.archetypes).ok;
const useSaved=saved&&(!haveInitial||saved.u?.title===initial.title);

let S={u:haveInitial?C.clone(initial):(useSaved?.u?C.clone(useSaved.u):null),phase:haveInitial?(initial.relationships?.length?'studio':'cast'):'studio',tab:'graph',selected:null,positions:{},box:{x:0,y:0,w:900,h:600},filter:'all',search:'',undo:[],analysisStale:false,awaiting:false,request:null,castCollapsed:false,minimapVisible:true,...B.initial_view,...(useSaved||{})};
if(haveInitial){S.u=C.clone(initial);if(!useSaved){S.positions={};S.box={x:0,y:0,w:900,h:600};}}
S.undo=[];
if(!['graph','seeds','assets','suggestions','chronology','analyst'].includes(S.tab))S.tab='graph';

const colors=[['#9a3412','#fbf1e6'],['#0f766e','#e6f5f3'],['#991b1b','#faecec'],['#1e40af','#eef3fb'],['#166534','#edf7ee'],['#854d0e','#fcf6e5'],['#701a75','#f8edf7']];
const color=c=>colors[Math.max(0,S.u.characters.findIndex(x=>x.id===c.id))%colors.length];
const initials=name=>name.split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('');
function store(){if(B.portable)return;try{if(S.u){localStorage.setItem('characteros-seen','1');localStorage.setItem('sua-seen','1');}localStorage.setItem(STORE,JSON.stringify({u:S.u,phase:S.phase,tab:S.tab,selected:S.selected,positions:S.positions,box:S.box,analysisStale:S.analysisStale,castCollapsed:S.castCollapsed,minimapVisible:S.minimapVisible}));}catch{}}
function transitionUI(fn){if(document.startViewTransition&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){document.startViewTransition(fn);}else{fn();}}
function toast(text,canUndo=false){const t=$('#toast');if(!t)return;t.innerHTML=`<span>${e(text)}</span>${canUndo&&S.undo.length?`<button class="toast-undo" data-action="undo">Undo</button>`:''}`;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),5000);}
let toastTimer=null;
function change(next,label,editorial=false){const check=C.validate(next,B.schema,B.archetypes);if(!check.ok)throw Error(check.errors.join('\n'));S.undo.push({u:C.clone(S.u),phase:S.phase,analysisStale:S.analysisStale});if(S.undo.length>30)S.undo.shift();S.u=next;if(editorial)S.analysisStale=true;store();render();if(label)toast(label,true);}
function monogram(c,cls=''){const[col,wash]=color(c);return `<span class="monogram ${cls}" style="--color:${col};--wash:${wash}">${e(initials(c.name))}</span>`;}
function badge(){const modes={'curated-example':'Curated example · no live call','imported':'Imported story record','draft':'Story draft'};return `<span class="badge ${S.u.provenance.mode==='draft'?'live':''}"><span class="dot"></span>${modes[S.u.provenance.mode]||'Imported story'}</span>`;}

function blankEmptyHTML(){return `<header class="topbar">${brand()}${btn(icon('plus')+' New story','new','small')}${btn(icon('upload')+' Add a universe','connect','small')}${btn(icon('download')+' Export','export','primary small','disabled')}</header>
<main class="workspace blank">
 <div class="empty-stage">
   <div class="empty-orbit" aria-hidden="true"><span></span><span></span><span></span></div>

   <p class="empty-sub">Drag a universe <code>.json</code> onto this page, open <strong>Add a universe</strong>, or start from a <strong>New story</strong> premise. This is a static showcase — nothing is sent anywhere.</p>
   <div class="empty-actions">${btn(icon('plus')+' New story','new','primary')}${btn(icon('upload')+' Add a universe','connect','')}</div>

</main>`;}
function blankSkeletonHTML(){return `<header class="topbar">${brand()}${btn('Cancel request','cancel-pending','small')}</header>
<main class="workspace blank">
 <div class="skeleton-stage" aria-hidden="true">
   <div class="sk sk-title"></div><div class="sk sk-line"></div>
   <div class="sk-grid">${'<div class="sk-card"></div>'.repeat(4)}</div>
   <div class="sk sk-graph"></div>
 </div>
 <p class="empty-sub skeleton-note"><span class="spinner"></span> Generating your universe…</p>
</main>`;}

function render(){
 document.documentElement.style.setProperty('--cast-w',S.castCollapsed?'56px':'268px');
 if(!S.u){root.innerHTML=S.awaiting?blankSkeletonHTML():blankEmptyHTML();document.title='CharacterOS';return;}
 const u=S.u;const phaseIndex={cast:1,relationships:2,studio:3}[S.phase]??3;document.title=u.title+' — CharacterOS';
 root.innerHTML=`
<header class="topbar">${brand()}${btn(icon('plus')+'New story','new','small')}${btn(icon('upload')+'Add a universe','connect','small')}${btn(icon('download')+'Export','export','primary small')}</header>
<main class="workspace"><section class="story-head"><div class="story-title-row"><div><div class="eyebrow">${e(u.format)} <span class="sep">/</span> ${e(u.genre)}</div><h1 class="story-title">${e(u.title)}</h1></div><div class="story-controls">${btn(icon('edit')+'Story brief','edit-story','small')}${btn(icon('undo'),'undo','small',`aria-label="Undo last edit" ${S.undo.length?'':'disabled'}`)}</div></div><p class="logline">${e(u.concept)}</p></section>

function renderInspector(){const item=selected();if(!item)return `<div class="panel-head"><span class="panel-title">The space between people</span></div><div class="inspector-body"><h2 class="detail-title">Choose a connection.</h2><p class="muted">Each edge holds two wants, a shared history and a possible breaking point.</p></div>`;const isC=S.selected.type==='character';return `<div class="panel-head"><span class="panel-title">${isC?'Character notes':'Relationship notes'}</span>${icon(isC?'book':'graph')}</div><div class="inspector-body">${isC?profile(item):edgeDetail(item)}</div><div class="inspector-actions">${btn(icon('edit')+'Edit '+(isC?'character':'relationship'),isC?'edit-character':'edit-edge','small',`data-id="${item.id}"`)}${!isC?btn('Find story seed','edge-seed','ghost small',`data-id="${item.id}"`):''}</div>`;}
function defaultPositions(){const active=new Set(S.u.characters.map(c=>c.id));for(const id of Object.keys(S.positions)){const p=S.positions[id];if(!active.has(id)||!p||typeof p.x!=='number'||typeof p.y!=='number'||isNaN(p.x)||isNaN(p.y)||p.x<-200||p.x>1500||p.y<-200||p.y>1200)delete S.positions[id];}const n=S.u.characters.length,fresh=!Object.keys(S.positions).length;let addedNew=false;S.u.characters.forEach((c,i)=>{if(!S.positions[c.id]){addedNew=true;const angle=-Math.PI/2+i*2*Math.PI/n;let pos={x:450+290*Math.cos(angle),y:300+205*Math.sin(angle)};if(!fresh){const existing=Object.values(S.positions),candidates=[];for(const scale of [1,1.25,1.5])for(let j=0;j<48;j++){const a=j*Math.PI/24,candidate={x:450+290*scale*Math.cos(a),y:300+205*scale*Math.sin(a)};candidate.clearance=Math.min(...existing.map(p=>Math.max(Math.abs(p.x-candidate.x)/236,Math.abs(p.y-candidate.y)/98)));candidate.scale=scale;candidates.push(candidate);}const clear=candidates.filter(p=>p.clearance>1.05).sort((a,b)=>a.scale-b.scale||b.clearance-a.clearance),best=clear[0]||candidates.sort((a,b)=>b.clearance-a.clearance)[0];pos={x:best.x,y:best.y};}S.positions[c.id]=pos;}});if(fresh||addedNew){const chars=S.u.characters;for(let iter=0;iter<6;iter++){let moved=false;for(let i=0;i<chars.length;i++){for(let j=i+1;j<chars.length;j++){const pi=S.positions[chars[i].id],pj=S.positions[chars[j].id];if(!pi||!pj)continue;const dx=pj.x-pi.x,dy=pj.y-pi.y,ox=236-Math.abs(dx),oy=94-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy*1.8){const px=(ox/2)*(dx>=0?1:-1);pi.x-=px;pj.x+=px;}else{const py=(oy/2)*(dy>=0?1:-1);pi.y-=py;pj.y+=py;}moved=true;}}}if(!moved)break;}}}
function renderMinimapHUD(){return `<div class="minimap-hud ${S.minimapVisible?'':'minimized'}" id="minimap-hud"><div class="minimap-head" data-action="toggle-minimap" title="Toggle minimap radar"><span>RADAR</span><span class="micro">${S.minimapVisible?'▼':'▲'}</span></div><div class="minimap-body"><svg class="minimap-svg" id="minimap-svg" viewBox="-200 -100 1300 850" preserveAspectRatio="xMidYMid meet"></svg></div></div>`;}
function drawMinimap(){const svg=$('#minimap-svg');if(!svg||!S.minimapVisible)return;const positions=Object.values(S.positions);if(!positions.length)return;let minX=Math.min(-100,...positions.map(p=>p.x-120),S.box.x),maxX=Math.max(1000,...positions.map(p=>p.x+120),S.box.x+S.box.w),minY=Math.min(-50,...positions.map(p=>p.y-50),S.box.y),maxY=Math.max(650,...positions.map(p=>p.y+50),S.box.y+S.box.h);const pad=70;minX-=pad;minY-=pad;const mapW=(maxX-minX)+pad*2,mapH=(maxY-minY)+pad*2;svg.setAttribute('viewBox',`${minX} ${minY} ${mapW} ${mapH}`);const edges=S.u.relationships.map(r=>{const a=S.positions[r.source],b=S.positions[r.target];if(!a||!b)return '';const sel=S.selected?.type==='edge'&&S.selected.id===r.id;return `<line data-map-edge="${r.id}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${sel?'var(--accent)':'var(--edge)'}" stroke-width="${sel?'7':'3.5'}" stroke-opacity="${sel?'0.95':'0.4'}"/>`;}).join('');const nodes=S.u.characters.map(c=>{const p=S.positions[c.id];if(!p)return '';const[col]=color(c);const sel=S.selected?.type==='character'&&S.selected.id===c.id;const size=sel?18:12,half=size/2;return `<rect data-map-node="${c.id}" x="${p.x-half}" y="${p.y-half}" width="${size}" height="${size}" fill="${col}" stroke="#ffffff" stroke-width="2" class="minimap-dot"/>`;}).join('');const lens=`<rect class="minimap-lens" x="${S.box.x}" y="${S.box.y}" width="${S.box.w}" height="${S.box.h}" rx="0"/>`;svg.innerHTML=edges+nodes+lens;bindMinimap(svg,minX,minY,mapW,mapH);}
function updateMinimapLens(){const svg=$('#minimap-svg');if(!svg)return;const lens=svg.querySelector('.minimap-lens');if(lens){lens.setAttribute('x',S.box.x);lens.setAttribute('y',S.box.y);lens.setAttribute('width',S.box.w);lens.setAttribute('height',S.box.h);}}
function updateMinimapNode(id,nx,ny){const svg=$('#minimap-svg');if(!svg||!S.minimapVisible)return;const dot=svg.querySelector(`[data-map-node="${id}"]`);if(dot){const size=Number(dot.getAttribute('width'))||12;dot.setAttribute('x',nx-size/2);dot.setAttribute('y',ny-size/2);}S.u.relationships.forEach(r=>{if(r.source===id||r.target===id){const line=svg.querySelector(`[data-map-edge="${r.id}"]`);if(line){const a=S.positions[r.source],b=S.positions[r.target];if(a&&b){line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);}}}});}
function bindMinimap(svg,minX,minY,mapW,mapH){if(svg.dataset.bound)return;svg.dataset.bound='1';let draggingLens=false,startPt=null,startBox=null;const getMapPt=ev=>{const rect=svg.getBoundingClientRect(),nx=(ev.clientX-rect.left)/rect.width,ny=(ev.clientY-rect.top)/rect.height;return {x:minX+nx*mapW,y:minY+ny*mapH};};svg.onpointerdown=ev=>{ev.stopPropagation();const lens=ev.target.closest('.minimap-lens'),pt=getMapPt(ev);draggingLens=true;startPt=pt;startBox={...S.box};svg.setPointerCapture(ev.pointerId);if(!lens){S.box.x=pt.x-S.box.w/2;S.box.y=pt.y-S.box.h/2;startBox={...S.box};const canvas=$('#graph-canvas');if(canvas)canvas.setAttribute('viewBox',`${S.box.x} ${S.box.y} ${S.box.w} ${S.box.h}`);updateMinimapLens();}};svg.onpointermove=ev=>{if(!draggingLens)return;ev.stopPropagation();const pt=getMapPt(ev);S.box.x=startBox.x+(pt.x-startPt.x);S.box.y=startBox.y+(pt.y-startPt.y);const canvas=$('#graph-canvas');if(canvas)canvas.setAttribute('viewBox',`${S.box.x} ${S.box.y} ${S.box.w} ${S.box.h}`);updateMinimapLens();};const stopDrag=ev=>{if(!draggingLens)return;draggingLens=false;try{svg.releasePointerCapture(ev.pointerId);}catch{}store();drawGraph();drawMinimap();};svg.onpointerup=stopDrag;svg.onpointercancel=stopDrag;}
function edgeGeometry(r,i){const a=S.positions[r.source],b=S.positions[r.target];if(!a||!b)return null;let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;const ra=1/Math.max(Math.abs(dx)/112,Math.abs(dy)/43,.001),rb=ra;const start={x:a.x+dx*ra,y:a.y+dy*ra},end={x:b.x-dx*rb,y:b.y-dy*rb};const bend=((i%2)?1:-1)*22;const mid={x:(a.x+b.x)/2-dy/len*bend,y:(a.y+b.y)/2+dx/len*bend};const path=`M${start.x},${start.y} Q${mid.x},${mid.y} ${end.x},${end.y}`;const label={x:(start.x+2*mid.x+end.x)/4,y:(start.y+2*mid.y+end.y)/4};const width=Math.min(170,Math.max(52,r.label.length*6+18));return {path,label,width};}
function updateEdges(svg,nodeId){S.u.relationships.forEach((r,i)=>{if(r.source!==nodeId&&r.target!==nodeId)return;const g=edgeGeometry(r,i);if(!g)return;const edgeEl=svg.querySelector(`[data-edge="${r.id}"]`);if(!edgeEl)return;const p1=edgeEl.querySelector('.edge-path');if(p1)p1.setAttribute('d',g.path);const p2=edgeEl.querySelector('.edge-hit');if(p2)p2.setAttribute('d',g.path);const bg=edgeEl.querySelector('.edge-label-bg');if(bg){bg.setAttribute('x',g.label.x-g.width/2);bg.setAttribute('y',g.label.y-11);}const txt=edgeEl.querySelector('.edge-label');if(txt){txt.setAttribute('x',g.label.x);txt.setAttribute('y',g.label.y+4);}});}
function graphInner(){defaultPositions();const sel=S.selected;let connectedNodes=null,connectedEdges=null;if(sel?.type==='character'){const rels=S.u.relationships.filter(r=>r.source===sel.id||r.target===sel.id);connectedEdges=new Set(rels.map(r=>r.id));connectedNodes=new Set([sel.id,...rels.flatMap(r=>[r.source,r.target])]);}else if(sel?.type==='edge'){const rel=S.u.relationships.find(r=>r.id===sel.id);if(rel){connectedEdges=new Set([rel.id]);connectedNodes=new Set([rel.source,rel.target]);}}const defs=`<defs><filter id="ink-bleed" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>`;const edges=S.u.relationships.map((r,i)=>{const g=edgeGeometry(r,i);if(!g)return '';const tension=r.intensity>=5?'high-tension':'';const isSel=sel?.type==='edge'&&sel.id===r.id;const isHigh=connectedEdges&&connectedEdges.has(r.id)&&!isSel;const isDim=connectedEdges&&!connectedEdges.has(r.id);return `<g class="edge ${tension} ${isSel?'selected':''} ${isHigh?'highlighted':''} ${isDim?'dim':''}" data-edge="${r.id}" role="button" tabindex="0" aria-label="${e(C.names(S.u,r.source)+' '+r.label+' '+C.names(S.u,r.target))}"><path class="edge-path" d="${g.path}"/><path class="edge-hit" d="${g.path}"/><rect class="edge-label-bg" x="${g.label.x-g.width/2}" y="${g.label.y-11}" width="${g.width}" height="22" rx="0"/><text class="edge-label" text-anchor="middle" x="${g.label.x}" y="${g.label.y+4}">${e(r.label.length>25?r.label.slice(0,24)+'…':r.label)}</text></g>`;}).join('');const nodes=S.u.characters.map((c,i)=>{const p=S.positions[c.id],[col,wash]=color(c);const isSel=sel?.type==='character'&&sel.id===c.id;const isPeer=connectedNodes&&connectedNodes.has(c.id)&&!isSel;const isDim=connectedNodes&&!connectedNodes.has(c.id);return `<g class="graph-node ${isSel?'selected':''} ${isPeer?'connected-peer':''} ${isDim?'dim':''}" style="--stagger-i: ${i};" data-node="${c.id}" transform="translate(${p.x-112},${p.y-40})" role="button" tabindex="0" aria-label="Inspect ${e(c.name)}"><rect class="body" width="224" height="80" rx="0"/><rect x="12" y="18" width="34" height="44" rx="0" fill="${wash}"/><text class="n-initial" x="29" y="46" fill="${col}" text-anchor="middle">${e(initials(c.name))}</text><text class="n-name" x="56" y="34">${e(c.name.length>18?c.name.split(' ')[0]:c.name)}</text><text class="n-role" x="56" y="52">${e(c.role.split('·')[0].trim().slice(0,22))}</text><rect x="204" y="10" width="6" height="6" fill="${col}"/></g>`;}).join('');return defs+edges+nodes;}

function updateGraphSelection(svg,preview=null){if(!svg)return;const target=preview!==null?preview:S.selected;let connectedNodes=null,connectedEdges=null;if(target?.type==='character'){const cid=target.id;const rels=S.u.relationships.filter(r=>r.source===cid||r.target===cid);connectedEdges=new Set(rels.map(r=>r.id));connectedNodes=new Set([cid,...rels.flatMap(r=>[r.source,r.target])]);}else if(target?.type==='edge'){const rel=S.u.relationships.find(r=>r.id===target.id);if(rel){connectedEdges=new Set([rel.id]);connectedNodes=new Set([rel.source,rel.target]);}}svg.querySelectorAll('.graph-node').forEach(el=>{const id=el.dataset.node;const isPrimary=target?.type==='character'&&target.id===id;const isPeer=connectedNodes&&connectedNodes.has(id)&&!isPrimary;const isDim=connectedNodes&&!connectedNodes.has(id);el.classList.toggle('selected',S.selected?.type==='character'&&S.selected.id===id);el.classList.toggle('active-hover',!!preview&&isPrimary);el.classList.toggle('connected-peer',!!isPeer);el.classList.toggle('dim',!!isDim);});svg.querySelectorAll('.edge').forEach(el=>{const id=el.dataset.edge;const isSelectedEdge=S.selected?.type==='edge'&&S.selected.id===id;const isConnected=connectedEdges&&connectedEdges.has(id);const isDim=connectedEdges&&!connectedEdges.has(id);el.classList.toggle('selected',isSelectedEdge);el.classList.toggle('highlighted',!!isConnected&&!isSelectedEdge);el.classList.toggle('dim',!!isDim);});if(preview===null){document.querySelectorAll('.character-tile').forEach(el=>{el.classList.toggle('active',S.selected?.type==='character'&&el.dataset.id===S.selected.id);});}}
function bindGraph(){const svg=$('#graph-canvas');if(!svg)return;let drag=null,lastMoveTime=0,velX=0,velY=0,rafMove=null,pendingPt=null,currentHoverKey=null;
 const updateDrag=()=>{rafMove=null;if(!drag||!drag.moved||!pendingPt)return;const p=pendingPt,now=performance.now(),dt=Math.max(1,now-lastMoveTime);if(!drag.id){velX=(drag.pt.x-p.x)/dt;velY=(drag.pt.y-p.y)/dt;S.box.x+=drag.pt.x-p.x;S.box.y+=drag.pt.y-p.y;svg.setAttribute('viewBox',`${S.box.x} ${S.box.y} ${S.box.w} ${S.box.h}`);updateMinimapLens();}else{const nx=Math.max(-400,Math.min(1600,drag.start.x+p.x-drag.pt.x));const ny=Math.max(-300,Math.min(1100,drag.start.y+p.y-drag.pt.y));S.positions[drag.id]={x:nx,y:ny};const nodeEl=svg.querySelector(`[data-node="${drag.id}"]`);if(nodeEl)nodeEl.setAttribute('transform',`translate(${nx-87},${ny-40})`);updateEdges(svg,drag.id);updateMinimapNode(drag.id,nx,ny);}lastMoveTime=now;};
 svg.onpointerdown=ev=>{if(ev.button!==0)return;if(glideId){cancelAnimationFrame(glideId);glideId=null;}if(rafMove){cancelAnimationFrame(rafMove);rafMove=null;}const node=ev.target.closest('[data-node]'),edge=ev.target.closest('[data-edge]');const p=graphPoint(svg,ev);drag={id:node?.dataset.node||null,edgeId:(!node&&edge)?edge.dataset.edge:null,pt:p,client:{x:ev.clientX,y:ev.clientY},start:node?{...S.positions[node.dataset.node]}:{...S.box},moved:false};velX=0;velY=0;lastMoveTime=performance.now();svg.classList.add('dragging');if(drag.id){const nodeEl=svg.querySelector(`[data-node="${drag.id}"]`);if(nodeEl)nodeEl.classList.add('is-dragging');}svg.setPointerCapture(ev.pointerId);};
 svg.onpointermove=ev=>{if(!drag)return;if(!drag.moved&&Math.hypot(ev.clientX-drag.client.x,ev.clientY-drag.client.y)>3){drag.moved=true;}if(!drag.moved)return;pendingPt=graphPoint(svg,ev);if(!rafMove){rafMove=requestAnimationFrame(updateDrag);}};
 svg.onpointerup=ev=>{if(!drag)return;if(rafMove){cancelAnimationFrame(rafMove);rafMove=null;updateDrag();}const d=drag;drag=null;pendingPt=null;svg.classList.remove('dragging');try{svg.releasePointerCapture(ev.pointerId);}catch{}if(d.id){const nodeEl=svg.querySelector(`[data-node="${d.id}"]`);if(nodeEl)nodeEl.classList.remove('is-dragging');}if(d.moved){svg.dataset.dragged='1';setTimeout(()=>delete svg.dataset.dragged,120);store();if(!d.id&&Math.hypot(velX,velY)>0.05&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){let vx=velX*14,vy=velY*14;const glide=()=>{if(Math.hypot(vx,vy)<0.2){store();drawMinimap();return;}S.box.x+=vx;S.box.y+=vy;vx*=0.90;vy*=0.90;svg.setAttribute('viewBox',`${S.box.x} ${S.box.y} ${S.box.w} ${S.box.h}`);updateMinimapLens();glideId=requestAnimationFrame(glide);};glideId=requestAnimationFrame(glide);}else if(d.id){if(S.selected?.type!=='character'||S.selected.id!==d.id){S.selected={type:'character',id:d.id};const ins=$('.inspector');if(ins)ins.innerHTML=renderInspector();updateGraphSelection(svg);}drawMinimap();store();}}else{if(d.id){S.selected={type:'character',id:d.id};}else if(d.edgeId){S.selected={type:'edge',id:d.edgeId};}else{S.selected=null;}const ins=$('.inspector');if(ins)ins.innerHTML=renderInspector();updateGraphSelection(svg);store();}};
 svg.onpointercancel=()=>{if(rafMove){cancelAnimationFrame(rafMove);rafMove=null;}if(drag){if(drag.id){const nodeEl=svg.querySelector(`[data-node="${drag.id}"]`);if(nodeEl)nodeEl.classList.remove('is-dragging');}drag=null;pendingPt=null;svg.classList.remove('dragging');store();drawMinimap();}};
 svg.onpointerover=ev=>{if(svg.classList.contains('dragging')||drag)return;const node=ev.target.closest('[data-node]'),edge=ev.target.closest('[data-edge]');let key=null,preview=null;if(node){key='node:'+node.dataset.node;preview={type:'character',id:node.dataset.node};}else if(edge){key='edge:'+edge.dataset.edge;preview={type:'edge',id:edge.dataset.edge};}if(key!==currentHoverKey){currentHoverKey=key;updateGraphSelection(svg,preview);}};
 svg.onpointerleave=()=>{if(svg.classList.contains('dragging')||drag)return;if(currentHoverKey!==null){currentHoverKey=null;updateGraphSelection(svg,null);}};
 document.querySelectorAll('.character-tile').forEach(tile=>{tile.onpointerenter=()=>{const canvas=$('#graph-canvas');if(canvas&&!canvas.classList.contains('dragging'))updateGraphSelection(canvas,{type:'character',id:tile.dataset.id});};tile.onpointerleave=()=>{const canvas=$('#graph-canvas');if(canvas&&!canvas.classList.contains('dragging'))updateGraphSelection(canvas,null);};});
 svg.onclick=ev=>{ev.preventDefault();};
 svg.onkeydown=ev=>{const node=ev.target.closest('[data-node]'),edge=ev.target.closest('[data-edge]');if(['Enter',' '].includes(ev.key)){ev.preventDefault();S.selected={type:node?'character':'edge',id:node?.dataset.node||edge?.dataset.edge};const ins=$('.inspector');if(ins)ins.innerHTML=renderInspector();updateGraphSelection(svg);store();$('.inspector .panel-title')?.scrollIntoView({block:'nearest'});}else if(node&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key)){ev.preventDefault();const p=S.positions[node.dataset.node];p.x+=ev.key==='ArrowRight'?15:ev.key==='ArrowLeft'?-15:0;p.y+=ev.key==='ArrowDown'?15:ev.key==='ArrowUp'?-15:0;node.setAttribute('transform',`translate(${p.x-87},${p.y-40})`);updateEdges(svg,node.dataset.node);updateMinimapNode(node.dataset.node,p.x,p.y);store();}};
 svg.addEventListener('wheel',ev=>{ev.preventDefault();const f=ev.deltaY>0?1.1:.91,p=graphPoint(svg,ev);svg.classList.add('arranging');zoom(f,p);svg.classList.remove('arranging');},{passive:false});}
function zoom(f,p){const b=S.box,w=Math.max(350,Math.min(2200,b.w*f)),h=w*2/3,c=p||{x:b.x+b.w/2,y:b.y+b.h/2};const ratio=w/b.w;S.box={x:c.x-(c.x-b.x)*ratio,y:c.y-(c.y-b.y)*ratio,w,h};drawGraph();store();}

 <div class="metric-box"><span class="lbl">Average Cast Pressure</span><span class="val">${m.avgPressure} / 5.0</span></div>
</div>`;

function renderSeeds(){const seedsList=C.seeds(S.u);return `<div class="section-head"><div><div class="eyebrow">Relationships in motion</div><h2>Scenes that come from your cast.</h2><p>Compiled from the highest-pressure approved edges, not an unrelated plot generator.</p></div>${btn(icon('download')+'Export seeds','save-seeds','small')}</div><div class="content-grid">${seedsList.map((s,i)=>{const isCatalyst=i===0,hookChar=s.hook?s.hook.charAt(0):'',hookRest=s.hook?s.hook.slice(1):'';return `<article class="card stagger-item ${isCatalyst?'seed-card catalyst':''}" style="--stagger-i: ${i};"><div class="seed-number">${isCatalyst?'★ Catalyst Seed 01':`0${i+1}`}</div><h3>${e(s.title)}</h3><div class="card-tags">${s.characters.map(id=>`<button class="tag" data-action="select-character" data-id="${id}">${e(C.names(S.u,id))}</button>`).join('')}</div><p><strong>${e(s.trigger)}</strong></p><p class="mt">${isCatalyst?`<span class="drop-cap">${e(hookChar)}</span>`:''}${e(isCatalyst?hookRest:s.hook)}</p><div class="seed-question">${e(s.question)}</div><div class="card-actions">${btn('Inspect source relationship','select-edge','small',`data-id="${s.relationship_id}"`)}</div><div class="source-ref">Approved edge ${e(s.relationship_id)} · revision ${s.basis_revision}</div></article>`;}).join('')||'<div class="empty">Map relationships first.</div>'}</div>`;}
function renderAssets(){let list=C.assets(S.u).filter(x=>S.filter==='all'||x.category===S.filter);if(S.search)list=list.filter(x=>(x.title+' '+x.prompt).toLowerCase().includes(S.search.toLowerCase()));return `<div class="section-head"><div><div class="eyebrow">A shared visual language</div><h2>One universe. A coherent prompt kit.</h2><p>These are copy-ready prompts—not generated images. Every category uses the same approved visual direction.</p></div>${btn(icon('download')+'Export prompt kit','save-prompts','small')}</div><div class="palette">${S.u.visual.palette.map(x=>`<span class="palette-chip">${e(x)}</span>`).join('')}<span>${e(S.u.visual.style)}</span></div><div class="filterbar">${[['all','All prompts'],['portraits','Portraits'],['scenes','Scenes'],['presentation','Presentation'],['moodboard','Mood board']].map(([id,t])=>`<button class="filter ${S.filter===id?'active':''}" data-action="filter" data-value="${id}">${t}</button>`).join('')}<input class="searchbox" id="asset-search" aria-label="Search asset prompts" placeholder="Search prompts…" value="${e(S.search)}"></div><div class="content-grid">${list.map((a,i)=>`<article class="card prompt-card stagger-item" style="--stagger-i: ${i};"><div class="prompt-cover ${a.category}"><span class="symbol">${{portraits:'Aa',scenes:'⌑',presentation:'◫',moodboard:'⊞'}[a.category]}</span><span class="badge">${a.aspect_ratio} · prompt only</span></div><div class="prompt-body"><div class="eyebrow">${a.category}</div><h3>${e(a.title)}</h3><p class="prompt-excerpt">${e(a.prompt)}</p><div class="card-actions">${btn(icon('copy')+'Copy','copy-asset','primary small',`data-id="${a.id}"`)}${btn('Read prompt','view-asset','small',`data-id="${a.id}"`)}</div></div></article>`).join('')||'<p class="empty">No prompts match that search.</p>'}</div>`;}
function renderSuggestions(){const g=C.gaps(S.u);return `<div class="section-head"><div><div class="eyebrow">Possibilities, not prescriptions</div><h2>What would another person change?</h2><p>Suggestions stay outside the canon until you accept them. A story does not require every archetype.</p></div><span class="badge">${S.u.suggestions.filter(p=>p.status==='pending').length} awaiting your judgment</span></div>${g.length?`<div class="wide-banner"><div>${g.map(x=>`<strong>${e(x.title)}</strong><small>${e(x.detail)}</small>`).join('<br>')}</div></div>`:''}<div class="proposals">${S.u.suggestions.map((p,i)=>`<article class="card stagger-item" style="--stagger-i: ${i};"><div class="proposal-status">${p.status==='pending'?'Proposed addition · not canon':p.status==='accepted'?'✓ Accepted into the cast':'Not included'}</div><h3>${e(p.character.name)}</h3><div class="detail-sub">${e(p.character.role)} · ${e(p.character.archetype_label)}</div><div class="tension-box"><span class="detail-label">${e(p.gap)}</span><p>${e(p.rationale)}</p></div>${block('What this changes',p.impact)}<div class="quote">“${e(p.character.voice_samples[0])}”</div><div class="card-tags">${p.relationships.map(r=>`<span class="tag">${e(r.label)} · ${e(C.names(S.u,r.source===p.character.id?r.target:r.source))}</span>`).join('')}</div><div class="card-actions">${btn('Read full proposal','proposal','small',`data-id="${p.id}"`)}${p.status==='pending'?btn(icon('plus')+'Adopt into canon','accept','primary small',`data-id="${p.id}"`)+btn('Shelve proposal','reject','ghost small',`data-id="${p.id}"`):''}</div></article>`).join('')||'<div class="empty">Complete relationship mapping to receive optional additions.</div>'}</div><div class="activity">Accepting adds the character and proposed edges to the single approved record. Prompts and story seeds then compile from that updated record. Undo restores the previous decision.</div>`;}

let lastFocus=null;
function modal(title,body,footer='',wide=false,subtitle='',trigger=null){lastFocus=trigger||document.activeElement;let origStyle='';if(lastFocus&&lastFocus.getBoundingClientRect){const r=lastFocus.getBoundingClientRect(),ox=Math.round(r.left+r.width/2),oy=Math.round(r.top+r.height/2);origStyle=`--orig-x:${ox}px;--orig-y:${oy}px;`;}modalRoot.innerHTML=`<div class="modal-overlay"><section class="modal ${wide?'wide':''}" style="${origStyle}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><h2 id="modal-title">${e(title)}</h2>${subtitle?`<p>${e(subtitle)}</p>`:''}</div><button class="iconbtn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;setTimeout(()=>modalRoot.querySelector('textarea,input,select,button')?.focus(),40);}
function closeModal(){const m=modalRoot.querySelector('.modal');if(m&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){m.classList.add('closing');setTimeout(()=>{modalRoot.innerHTML='';if(lastFocus&&lastFocus.focus){try{lastFocus.focus();}catch{}}},170);}else{modalRoot.innerHTML='';if(lastFocus&&lastFocus.focus){try{lastFocus.focus();}catch{}}}}
